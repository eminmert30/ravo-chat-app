services:
  - type: web
    name: ravochat-backend
    env: node
    plan: starter
    buildCommand: |
      npm install
      npx prisma generate
      npx prisma db push
      npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ravochat-db
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://ravochat-backend.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://ravochat-backend.onrender.com

databases:
  - name: ravochat-db
    plan: starter
    databaseName: ravochat
    user: ravochat_user
